<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Executive Budget & Multi-Currency Hub</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <style>
        @import url('https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@300;400;500;600;700;800&display=swap');
        
        body { 
            font-family: 'Plus Jakarta Sans', -apple-system, BlinkMacSystemFont, sans-serif; 
            background: #0f172a; 
            color: #f8fafc;
        }

        .glass-card {
            background: rgba(30, 41, 59, 0.7);
            backdrop-filter: blur(12px);
            border: 1px solid rgba(255, 255, 255, 0.08);
            box-shadow: 0 20px 25px -5px rgba(0, 0, 0, 0.3), 0 8px 10px -6px rgba(0, 0, 0, 0.3);
        }

        .input-sleek {
            background: rgba(15, 23, 42, 0.8);
            border: 1px solid rgba(255, 255, 255, 0.12);
            color: #f1f5f9;
            transition: all 0.2s cubic-bezier(0.4, 0, 0.2, 1);
        }
        .input-sleek:focus {
            outline: none;
            border-color: #38bdf8;
            box-shadow: 0 0 0 3px rgba(56, 189, 248, 0.2);
            background: rgba(15, 23, 42, 0.95);
        }

        ::-webkit-scrollbar { width: 6px; height: 6px; }
        ::-webkit-scrollbar-track { background: rgba(15, 23, 42, 0.6); }
        ::-webkit-scrollbar-thumb { background: rgba(255, 255, 255, 0.15); border-radius: 9999px; }
        ::-webkit-scrollbar-thumb:hover { background: rgba(255, 255, 255, 0.25); }
    </style>
</head>
<body class="min-h-screen pb-20 selection:bg-sky-500 selection:text-white">

    <!-- Top Executive Header -->
    <header class="sticky top-0 z-40 bg-slate-900/80 backdrop-blur-md border-b border-slate-800/80">
        <div class="max-w-7xl mx-auto px-4 sm:px-8 py-4 flex flex-col md:flex-row justify-between items-center gap-4">
            <div class="flex items-center gap-3.5">
                <div class="h-11 w-11 rounded-2xl bg-gradient-to-tr from-sky-500 via-indigo-500 to-violet-600 flex items-center justify-center shadow-lg shadow-sky-500/20">
                    <i class="fa-solid fa-chart-line text-white text-lg"></i>
                </div>
                <div>
                    <h1 class="text-xl font-extrabold tracking-tight bg-gradient-to-r from-white via-slate-200 to-slate-400 bg-clip-text text-transparent">
                        Financial Hub
                    </h1>
                    <p class="text-xs text-slate-400 font-medium flex items-center gap-2">
                        <span>Multi-Currency Dashboard</span>
                        <span class="inline-block w-1 h-1 rounded-full bg-slate-600"></span>
                        <span id="syncStatus" class="text-sky-400 font-semibold">Local Storage Mode</span>
                    </p>
                </div>
            </div>

            <!-- Header Quick Action Bar -->
            <div class="flex items-center gap-2.5 flex-wrap">
                <button onclick="saveToCloud()" class="text-xs font-semibold bg-sky-600 hover:bg-sky-500 text-white px-3.5 py-2 rounded-xl transition duration-150 flex items-center gap-2 shadow-sm cursor-pointer">
                    <i class="fa-solid fa-cloud-arrow-up"></i> Save to Cloud
                </button>
                <button onclick="loadFromCloud()" class="text-xs font-semibold bg-emerald-600 hover:bg-emerald-500 text-white px-3.5 py-2 rounded-xl transition duration-150 flex items-center gap-2 shadow-sm cursor-pointer">
                    <i class="fa-solid fa-cloud-arrow-down"></i> Load from Cloud
                </button>
                <button onclick="configureCloud()" class="text-xs font-semibold bg-slate-800 hover:bg-slate-700 text-slate-300 border border-slate-700 px-3 py-2 rounded-xl transition cursor-pointer" title="Cloud Settings">
                    <i class="fa-solid fa-gear"></i>
                </button>
                <div class="h-6 w-px bg-slate-800 mx-1"></div>
                <button onclick="resetAllData()" class="text-xs font-semibold bg-rose-500/10 hover:bg-rose-500/20 text-rose-400 border border-rose-500/20 px-3.5 py-2 rounded-xl transition duration-150 flex items-center gap-2 cursor-pointer">
                    <i class="fa-solid fa-rotate-right"></i> Reset
                </button>
            </div>
        </div>
    </header>

    <!-- Main Content Area -->
    <main class="max-w-7xl mx-auto px-4 sm:px-8 pt-8 space-y-8">
        <div class="flex justify-between items-center border-b border-slate-800/80 pb-4">
            <div class="flex items-center gap-2 overflow-x-auto no-scrollbar py-1" id="monthTabs"></div>
            <div class="hidden sm:flex items-center gap-2 text-xs font-medium text-slate-400 bg-slate-900/60 border border-slate-800 px-3 py-1.5 rounded-xl">
                <span class="w-2 h-2 rounded-full bg-emerald-500 animate-pulse"></span> Dynamic Rollover Active
            </div>
        </div>

        <div id="monthDashboard" class="space-y-8"></div>
    </main>

    <script>
        const MONTHS_CONFIG = [
            { id: 1, name: "September", short: "SEP" },
            { id: 2, name: "October", short: "OCT" },
            { id: 3, name: "November", short: "NOV" },
            { id: 4, name: "December", short: "DEC" }
        ];

        const DEFAULT_DATA = {
            activeMonthId: 1,
            months: {
                1: { salaryIncome: 850, exchangeRate: 277, euroBills: [{ name: "Firefly", dueDate: "1/6/2026", amount: 18 }, { name: "Spotify", dueDate: "1/22/2026", amount: 11 }], dzdExpenses: [{ name: "Phone Bill", amount: 10000 }, { name: "Food Budget", amount: 20000 }, { name: "Allowed Spending", amount: 17500 }], convertToDZD: 0, greyPortion: 100, payseraPortion: 50, initialGrey: 100, initialPaysera: 50, initialCCP: 15000, initialCash: 5000 },
                2: { salaryIncome: 850, exchangeRate: 277, euroBills: [{ name: "Firefly", dueDate: "1/6/2026", amount: 18 }, { name: "Spotify", dueDate: "1/22/2026", amount: 11 }], dzdExpenses: [{ name: "Phone Bill", amount: 10000 }, { name: "Food Budget", amount: 20000 }, { name: "Allowed Spending", amount: 17500 }], convertToDZD: 0, greyPortion: 100, payseraPortion: 50 },
                3: { salaryIncome: 850, exchangeRate: 277, euroBills: [{ name: "Firefly", dueDate: "1/6/2026", amount: 18 }, { name: "Spotify", dueDate: "1/22/2026", amount: 11 }], dzdExpenses: [{ name: "Phone Bill", amount: 10000 }, { name: "Food Budget", amount: 20000 }, { name: "Allowed Spending", amount: 17500 }], convertToDZD: 0, greyPortion: 100, payseraPortion: 50 },
                4: { salaryIncome: 850, exchangeRate: 277, euroBills: [{ name: "Firefly", dueDate: "1/6/2026", amount: 18 }, { name: "Spotify", dueDate: "1/22/2026", amount: 11 }], dzdExpenses: [{ name: "Phone Bill", amount: 10000 }, { name: "Food Budget", amount: 20000 }, { name: "Allowed Spending", amount: 17500 }], convertToDZD: 0, greyPortion: 100, payseraPortion: 50 }
            }
        };

        let appState = JSON.parse(localStorage.getItem('executive_budget_app_state')) || DEFAULT_DATA;
        let cloudConfig = JSON.parse(localStorage.getItem('executive_budget_cloud_cfg')) || { binId: '', apiKey: '' };

        function saveState() {
            localStorage.setItem('executive_budget_app_state', JSON.stringify(appState));
            renderApp();
        }

        function resetAllData() {
            if(confirm("Reset all financial data back to factory defaults?")) {
                appState = JSON.parse(JSON.stringify(DEFAULT_DATA));
                saveState();
            }
        }

        // --- JSONBin.io Cloud Sync Integration ---
        function configureCloud() {
            const binId = prompt("Enter your JSONBin.io Bin ID:", cloudConfig.binId || "");
            if (binId === null) return;
            const apiKey = prompt("Enter your JSONBin.io Master API Key:", cloudConfig.apiKey || "");
            if (apiKey === null) return;

            cloudConfig = { binId: binId.trim(), apiKey: apiKey.trim() };
            localStorage.setItem('executive_budget_cloud_cfg', JSON.stringify(cloudConfig));
            alert("Cloud credentials saved successfully!");
            updateSyncStatus();
        }

        function updateSyncStatus() {
            const statusEl = document.getElementById('syncStatus');
            if (cloudConfig.binId && cloudConfig.apiKey) {
                statusEl.textContent = "Cloud Sync Active (JSONBin)";
                statusEl.className = "text-emerald-400 font-semibold";
            } else {
                statusEl.textContent = "Local Storage Mode";
                statusEl.className = "text-sky-400 font-semibold";
            }
        }

        async function saveToCloud() {
            if (!cloudConfig.binId || !cloudConfig.apiKey) {
                alert("Please configure your Cloud Bin ID and API Key first using the gear icon button.");
                configureCloud();
                return;
            }

            try {
                const response = await fetch(`https://api.jsonbin.io/v3/b/${cloudConfig.binId}`, {
                    method: 'PUT',
                    headers: {
                        'Content-Type': 'application/json',
                        'X-Master-Key': cloudConfig.apiKey
                    },
                    body: JSON.stringify(appState)
                });

                if (response.ok) {
                    alert("Budget successfully saved to cloud!");
                } else {
                    alert("Failed to save to cloud. Check your Bin ID and API Key.");
                }
            } catch (err) {
                alert("Network error connecting to cloud.");
            }
        }

        async function loadFromCloud() {
            if (!cloudConfig.binId || !cloudConfig.apiKey) {
                alert("Please configure your Cloud Bin ID and API Key first using the gear icon button.");
                configureCloud();
                return;
            }

            try {
                const response = await fetch(`https://api.jsonbin.io/v3/b/${cloudConfig.binId}/latest`, {
                    method: 'GET',
                    headers: {
                        'X-Master-Key': cloudConfig.apiKey
                    }
                });

                if (response.ok) {
                    const resData = await response.json();
                    appState = resData.record;
                    saveState();
                    alert("Budget successfully loaded from cloud!");
                } else {
                    alert("Failed to load from cloud. Verify your credentials.");
                }
            } catch (err) {
                alert("Network error connecting to cloud.");
            }
        }

        // Calculation Engine
        function computeFinancials() {
            const computed = {};
            MONTHS_CONFIG.forEach((mConf, index) => {
                const data = appState.months[mConf.id];
                let prevGrey, prevPaysera, prevCCP, prevCash;

                if (index === 0) {
                    prevGrey = Number(data.initialGrey) || 0;
                    prevPaysera = Number(data.initialPaysera) || 0;
                    prevCCP = Number(data.initialCCP) || 0;
                    prevCash = Number(data.initialCash) || 0;
                } else {
                    const prevComp = computed[MONTHS_CONFIG[index-1].id];
                    prevGrey = data.initialGrey !== undefined ? Number(data.initialGrey) : prevComp.nextGrey;
                    prevPaysera = data.initialPaysera !== undefined ? Number(data.initialPaysera) : prevComp.nextPaysera;
                    prevCCP = data.initialCCP !== undefined ? Number(data.initialCCP) : prevComp.cashLeftDZD;
                    prevCash = data.initialCash !== undefined ? Number(data.initialCash) : 0;
                }

                let totalEuroExpenses = 0;
                (data.euroBills || []).forEach(b => totalEuroExpenses += Number(b.amount) || 0);

                const currentBalanceEuro = (Number(data.salaryIncome) + prevGrey + prevPaysera) - totalEuroExpenses - (Number(data.convertToDZD) || 0);
                
                const greyP = Math.max(0.001, Number(data.greyPortion) || 100);
                const payP = Math.max(0.001, Number(data.payseraPortion) || 50);
                const nextGrey = currentBalanceEuro * (greyP / (greyP + payP));
                const nextPaysera = currentBalanceEuro * (payP / (greyP + payP));

                const cashBalanceDZD = (Number(data.convertToDZD) || 0) * Number(data.exchangeRate);
                
                let totalDZDExpenses = 0;
                (data.dzdExpenses || []).forEach(e => totalDZDExpenses += Number(e.amount) || 0);

                const dzdExpensesEuroEquiv = totalDZDExpenses / (Number(data.exchangeRate) || 1);
                const cashLeftDZD = (cashBalanceDZD + prevCCP + prevCash) - totalDZDExpenses;

                computed[mConf.id] = {
                    prevGrey, prevPaysera, prevCCP, prevCash,
                    totalEuroExpenses, currentBalanceEuro,
                    nextGrey, nextPaysera,
                    cashBalanceDZD, totalDZDExpenses,
                    dzdExpensesEuroEquiv, cashLeftDZD
                };
            });
            return computed;
        }

        function renderApp() {
            renderTabs();
            renderDashboard();
            updateSyncStatus();
        }

        function renderTabs() {
            const container = document.getElementById('monthTabs');
            container.innerHTML = '';
            MONTHS_CONFIG.forEach(m => {
                const isActive = appState.activeMonthId === m.id;
                const btn = document.createElement('button');
                btn.className = `px-5 py-2.5 rounded-2xl font-bold text-xs tracking-wider transition-all duration-200 cursor-pointer flex items-center gap-2.5 ${
                    isActive 
                    ? 'bg-gradient-to-r from-sky-500 to-indigo-600 text-white shadow-lg shadow-sky-500/25 ring-1 ring-white/20' 
                    : 'bg-slate-900/80 text-slate-400 hover:bg-slate-800 hover:text-slate-200 border border-slate-800'
                }`;
                btn.innerHTML = `<span>${m.name}</span><span class="text-[10px] opacity-60 font-semibold uppercase px-1.5 py-0.5 rounded-md bg-black/20">${m.short}</span>`;
                btn.onclick = () => { appState.activeMonthId = m.id; renderApp(); };
                container.appendChild(btn);
            });
        }

        function renderDashboard() {
            const computed = computeFinancials();
            const activeId = appState.activeMonthId;
            const data = appState.months[activeId];
            const comp = computed[activeId];
            const container = document.getElementById('monthDashboard');

            let billsHtml = '';
            (data.euroBills || []).forEach((b, idx) => {
                billsHtml += `
                    <div class="grid grid-cols-12 gap-3 items-center bg-slate-900/60 hover:bg-slate-900 border border-slate-800 p-2.5 rounded-xl transition duration-150">
                        <input type="text" value="${b.name}" onchange="updateBill(${idx}, 'name', this.value)" class="col-span-5 input-sleek text-xs font-semibold rounded-lg px-2.5 py-2">
                        <input type="text" value="${b.dueDate}" onchange="updateBill(${idx}, 'dueDate', this.value)" class="col-span-3 input-sleek text-[11px] text-slate-400 text-center rounded-lg px-2 py-2">
                        <div class="col-span-3 flex items-center gap-1 bg-slate-950/80 border border-slate-800 px-2 py-1.5 rounded-lg">
                            <span class="text-xs font-bold text-sky-400">€</span>
                            <input type="number" value="${b.amount}" onchange="updateBill(${idx}, 'amount', this.value)" class="w-full bg-transparent text-right font-bold text-xs text-white focus:outline-none">
                        </div>
                        <button onclick="removeBill(${idx})" class="col-span-1 text-slate-500 hover:text-rose-400 text-center transition cursor-pointer"><i class="fa-solid fa-xmark text-xs"></i></button>
                    </div>`;
            });

            let dzdExpHtml = '';
            (data.dzdExpenses || []).forEach((e, idx) => {
                dzdExpHtml += `
                    <div class="grid grid-cols-12 gap-3 items-center bg-slate-900/60 hover:bg-slate-900 border border-slate-800 p-2.5 rounded-xl transition duration-150">
                        <input type="text" value="${e.name}" onchange="updateDzdExp(${idx}, 'name', this.value)" class="col-span-7 input-sleek text-xs font-semibold rounded-lg px-2.5 py-2">
                        <div class="col-span-4 flex items-center gap-1.5 bg-slate-950/80 border border-slate-800 px-2.5 py-1.5 rounded-lg">
                            <input type="number" value="${e.amount}" onchange="updateDzdExp(${idx}, 'amount', this.value)" class="w-full bg-transparent text-right font-bold text-xs text-emerald-400 focus:outline-none">
                            <span class="text-[10px] font-bold text-slate-500">DZD</span>
                        </div>
                        <button onclick="removeDzdExp(${idx})" class="col-span-1 text-slate-500 hover:text-rose-400 text-center transition cursor-pointer"><i class="fa-solid fa-xmark text-xs"></i></button>
                    </div>`;
            });

            container.innerHTML = `
                <div class="grid grid-cols-1 md:grid-cols-4 gap-4">
                    <div class="glass-card p-5 rounded-3xl relative overflow-hidden flex flex-col justify-between">
                        <div class="flex justify-between items-start">
                            <span class="text-[11px] font-extrabold uppercase tracking-wider text-slate-400">Prior / Rollover Liquidity</span>
                            <span class="text-xs bg-sky-500/10 text-sky-400 font-bold px-2 py-0.5 rounded-md border border-sky-500/20">Editable</span>
                        </div>
                        <div class="my-3 space-y-2">
                            <div class="flex justify-between items-center text-xs">
                                <span class="text-slate-400">Grey (€)</span>
                                <input type="number" value="${comp.prevGrey.toFixed(2)}" onchange="updateInitialField('initialGrey', this.value)" class="w-24 input-sleek font-bold text-right text-xs rounded-lg px-2 py-1 text-sky-400">
                            </div>
                            <div class="flex justify-between items-center text-xs">
                                <span class="text-slate-400">Paysera (€)</span>
                                <input type="number" value="${comp.prevPaysera.toFixed(2)}" onchange="updateInitialField('initialPaysera', this.value)" class="w-24 input-sleek font-bold text-right text-xs rounded-lg px-2 py-1 text-violet-400">
                            </div>
                            <div class="flex justify-between items-center text-xs">
                                <span class="text-slate-400">CCP (DZD)</span>
                                <input type="number" value="${comp.prevCCP}" onchange="updateInitialField('initialCCP', this.value)" class="w-28 input-sleek font-bold text-right text-xs rounded-lg px-2 py-1 text-emerald-400">
                            </div>
                            <div class="flex justify-between items-center text-xs">
                                <span class="text-slate-400">Cash (DZD)</span>
                                <input type="number" value="${comp.prevCash}" onchange="updateInitialField('initialCash', this.value)" class="w-28 input-sleek font-bold text-right text-xs rounded-lg px-2 py-1 text-amber-400">
                            </div>
                        </div>
                        <p class="text-[10px] text-slate-500 italic">Modify to override starting balances</p>
                    </div>

                    <div class="glass-card p-5 rounded-3xl relative overflow-hidden flex flex-col justify-between border-l-4 border-l-sky-500">
                        <div class="flex justify-between items-start">
                            <span class="text-[11px] font-extrabold uppercase tracking-wider text-sky-400">Current Euro Balance</span>
                            <i class="fa-solid fa-euro-sign text-sky-500/30 text-2xl"></i>
                        </div>
                        <div class="my-3">
                            <div class="text-3xl font-black text-white tracking-tight">€ ${comp.currentBalanceEuro.toFixed(2)}</div>
                            <span class="text-xs text-slate-400 mt-1 block">Income - Subscriptions - Conversions</span>
                        </div>
                        <div class="flex gap-2 text-[10px] font-semibold text-slate-400 border-t border-slate-800/80 pt-2">
                            <span>Grey: <strong class="text-sky-300">€${comp.nextGrey.toFixed(2)}</strong></span>
                            <span>•</span>
                            <span>Paysera: <strong class="text-violet-300">€${comp.nextPaysera.toFixed(2)}</strong></span>
                        </div>
                    </div>

                    <div class="glass-card p-5 rounded-3xl relative overflow-hidden flex flex-col justify-between border-l-4 border-l-emerald-500">
                        <div class="flex justify-between items-start">
                            <span class="text-[11px] font-extrabold uppercase tracking-wider text-emerald-400">Converted Cash Pool</span>
                            <i class="fa-solid fa-vault text-emerald-500/30 text-2xl"></i>
                        </div>
                        <div class="my-3">
                            <div class="text-3xl font-black text-emerald-400 tracking-tight">${comp.cashBalanceDZD.toLocaleString()} <span class="text-xs font-normal text-slate-400">DZD</span></div>
                            <span class="text-xs text-slate-400 mt-1 block">From € to DZD conversion</span>
                        </div>
                        <div class="text-[10px] text-slate-400 border-t border-slate-800/80 pt-2 flex justify-between">
                            <span>Market Rate</span>
                            <span class="font-bold text-slate-200">${data.exchangeRate} DZD / 1€</span>
                        </div>
                    </div>

                    <div class="glass-card p-5 rounded-3xl relative overflow-hidden flex flex-col justify-between border-l-4 border-l-amber-500">
                        <div class="flex justify-between items-start">
                            <span class="text-[11px] font-extrabold uppercase tracking-wider text-amber-400">Cash Left (Savings)</span>
                            <i class="fa-solid fa-wallet text-amber-500/30 text-2xl"></i>
                        </div>
                        <div class="my-3">
                            <div class="text-3xl font-black text-amber-400 tracking-tight">${comp.cashLeftDZD.toLocaleString()} <span class="text-xs font-normal text-slate-400">DZD</span></div>
                            <span class="text-xs text-slate-400 mt-1 block">Pool + Prior DZD - Expenses</span>
                        </div>
                        <div class="text-[10px] text-slate-400 border-t border-slate-800/80 pt-2 flex justify-between">
                            <span>Expenses EUR Equiv</span>
                            <span class="font-bold text-rose-400">${comp.dzdExpensesEuroEquiv.toFixed(2)} €</span>
                        </div>
                    </div>
                </div>

                <div class="grid grid-cols-1 lg:grid-cols-2 gap-8">
                    <div class="space-y-6">
                        <div class="glass-card p-6 rounded-3xl space-y-5">
                            <div class="flex justify-between items-center border-b border-slate-800/80 pb-3">
                                <h2 class="text-sm font-bold tracking-wider text-sky-400 uppercase flex items-center gap-2">
                                    <i class="fa-solid fa-credit-card text-sky-400"></i> Euro Income & Conversion
                                </h2>
                                <span class="text-xs text-slate-500 font-mono">EUR Engine</span>
                            </div>
                            <div class="space-y-4">
                                <div class="flex justify-between items-center">
                                    <label class="text-xs font-semibold text-slate-300">Monthly Salary Income (€)</label>
                                    <input type="number" value="${data.salaryIncome}" onchange="updateField('salaryIncome', this.value)" class="w-36 input-sleek font-bold text-right text-sm rounded-xl px-3 py-2">
                                </div>
                                <div class="flex justify-between items-center">
                                    <label class="text-xs font-semibold text-sky-400">Euro's to Convert to DZD</label>
                                    <input type="number" value="${data.convertToDZD}" onchange="updateField('convertToDZD', this.value)" class="w-36 input-sleek font-bold text-right text-sm rounded-xl px-3 py-2 text-emerald-400">
                                </div>
                            </div>
                        </div>

                        <div class="glass-card p-6 rounded-3xl space-y-4">
                            <div class="flex justify-between items-center border-b border-slate-800/80 pb-3">
                                <h3 class="text-sm font-bold tracking-wider text-sky-400 uppercase flex items-center gap-2">
                                    <i class="fa-solid fa-receipt text-sky-400"></i> Euro Subscriptions
                                </h3>
                                <button onclick="addBill()" class="text-xs font-semibold bg-sky-500/20 text-sky-300 hover:bg-sky-500/30 border border-sky-500/30 px-3 py-1.5 rounded-xl transition cursor-pointer">+ Add Bill</button>
                            </div>
                            <div class="space-y-2 max-h-60 overflow-y-auto pr-1">${billsHtml || '<p class="text-xs text-slate-500 italic text-center py-4">No Euro bills registered.</p>'}</div>
                            <div class="flex justify-between items-center pt-3 border-t border-slate-800/80 text-xs font-bold">
                                <span class="text-slate-400">Total Euro Bills Outflow</span>
                                <span class="text-sky-400 text-sm">€ ${comp.totalEuroExpenses.toFixed(2)}</span>
                            </div>
                        </div>
                    </div>

                    <div class="space-y-6">
                        <div class="glass-card p-6 rounded-3xl space-y-5">
                            <div class="flex justify-between items-center border-b border-slate-800/80 pb-3">
                                <h2 class="text-sm font-bold tracking-wider text-emerald-400 uppercase flex items-center gap-2">
                                    <i class="fa-solid fa-coins text-emerald-400"></i> DZD Market & Charges
                                </h2>
                                <span class="text-xs text-slate-500 font-mono">DZD Engine</span>
                            </div>
                            <div class="space-y-4">
                                <div class="flex justify-between items-center">
                                    <label class="text-xs font-semibold text-slate-300">Euro to DZD Exchange Rate</label>
                                    <input type="number" value="${data.exchangeRate}" onchange="updateField('exchangeRate', this.value)" class="w-36 input-sleek font-bold text-right text-sm rounded-xl px-3 py-2 text-emerald-400">
                                </div>
                                <div class="flex justify-between items-center pt-2 border-t border-slate-800/80">
                                    <span class="text-xs font-semibold text-slate-400">Total DZD Expenses</span>
                                    <div class="text-right">
                                        <div class="text-sm font-bold text-rose-400">${comp.totalDZDExpenses.toLocaleString()} DZD</div>
                                        <div class="text-[10px] text-rose-500 font-semibold">(${comp.dzdExpensesEuroEquiv.toFixed(2)} €)</div>
                                    </div>
                                </div>
                            </div>
                        </div>

                        <div class="glass-card p-6 rounded-3xl space-y-4">
                            <div class="flex justify-between items-center border-b border-slate-800/80 pb-3">
                                <h3 class="text-sm font-bold tracking-wider text-emerald-400 uppercase flex items-center gap-2">
                                    <i class="fa-solid fa-basket-shopping text-emerald-400"></i> Local DZD Expenses
                                </h3>
                                <button onclick="addDzdExp()" class="text-xs font-semibold bg-emerald-500/20 text-emerald-300 hover:bg-emerald-500/30 border border-emerald-500/30 px-3 py-1.5 rounded-xl transition cursor-pointer">+ Add Expense</button>
                            </div>
                            <div class="space-y-2 max-h-60 overflow-y-auto pr-1">${dzdExpHtml || '<p class="text-xs text-slate-500 italic text-center py-4">No local expenses registered.</p>'}</div>
                            <div class="flex justify-between items-center pt-3 border-t border-slate-800/80 text-xs font-bold">
                                <span class="text-slate-400">Total Local Expenses</span>
                                <span class="text-rose-400 text-sm">${comp.totalDZDExpenses.toLocaleString()} DZD</span>
                            </div>
                        </div>
                    </div>
                </div>
            `;
        }

        function updateField(field, val) {
            appState.months[appState.activeMonthId][field] = Number(val) || 0;
            saveState();
        }
        function updateInitialField(field, val) {
            appState.months[appState.activeMonthId][field] = Number(val) || 0;
            saveState();
        }
        function updateBill(idx, field, val) {
            appState.months[appState.activeMonthId].euroBills[idx][field] = val;
            saveState();
        }
        function addBill() {
            appState.months[appState.activeMonthId].euroBills.push({ name: "New Sub", dueDate: "1/1/2026", amount: 10 });
            saveState();
        }
        function removeBill(idx) {
            appState.months[appState.activeMonthId].euroBills.splice(idx, 1);
            saveState();
        }
        function updateDzdExp(idx, field, val) {
            appState.months[appState.activeMonthId].dzdExpenses[idx][field] = val;
            saveState();
        }
        function addDzdExp() {
            appState.months[appState.activeMonthId].dzdExpenses.push({ name: "New Expense", amount: 5000 });
            saveState();
        }
        function removeDzdExp(idx) {
            appState.months[appState.activeMonthId].dzdExpenses.splice(idx, 1);
            saveState();
        }

        renderApp();
    </script>
</body>
</html>
